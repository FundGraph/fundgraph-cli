name: fundgraph-cli CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Checkout compatible core repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fundgraph-core
          path: fundgraph-core
      - name: Install sibling core package
        run: npm install --ignore-scripts --no-save ./fundgraph-core
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  package:
    name: package artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fundgraph-core
          path: fundgraph-core
      - run: npm install --ignore-scripts --no-save ./fundgraph-core
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: fundgraph-cli-package
          path: '*.tgz'
